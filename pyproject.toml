[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdqc"
version = "0.3.0"
description = "TEM CD measurement quality — pure computation library (features, robust stats, z)"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.2",
    "scipy==1.18.0",
    "pandas==3.0.5",
    "opencv-python-headless==5.0.0.93",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["cdqc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
